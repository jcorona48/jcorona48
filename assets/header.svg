<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Joan Corona — Senior Software Engineer, Platform and Full Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .name { font: 700 56px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .role { font: 500 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #bfdbfe; }
      .code { font: 500 16px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #93c5fd; }
      .fade { opacity: 0; animation: in 0.9s ease-out forwards; }
      .d1 { animation-delay: 0.15s; } .d2 { animation-delay: 0.45s; } .d3 { animation-delay: 0.75s; }
      @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; } .cursor { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="220" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="220" rx="16" fill="url(#grid)"/>
  <circle cx="1080" cy="40" r="140" fill="#3b82f6" fill-opacity="0.18"/>
  <circle cx="1150" cy="200" r="90" fill="#60a5fa" fill-opacity="0.12"/>
  <text x="64" y="98" class="name fade d1">Joan Corona</text>
  <text x="66" y="138" class="role fade d2">Senior Software Engineer · Platform &amp; Full Stack</text>
  <g class="fade d3">
    <text x="66" y="180" class="code">$ building SDKs, design systems &amp; pipelines for product teams</text>
    <rect x="662" y="166" width="10" height="18" fill="#93c5fd" class="cursor"/>
  </g>
</svg>
